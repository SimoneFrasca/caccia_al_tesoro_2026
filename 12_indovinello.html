<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Bonaparte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <span class="message-text">
                    Una vecchia filastrocca in francese recita: <br>
                    <i>"Teuf de lazeur !<br>
                        Je suis un inemo en bitha,<br> 
                        et je suis téfé en vierjan,<br> 
                        entre le chonco et la chebrio : <br>
                        combien y a-t-il de croix là-bas ?"
                    </i>
                </span>
            </div>
        </div>

        <div class="reply-area">
            <input type="text" id="chiave_livello" placeholder="Scrivi il codice...">
            <button onclick="checkAnswers('livello12')" class="send-btn">➤</button>
        </div>

        <div id="error" style="color: red; font-weight: bold; margin-top: 10px;"></div>
        <div id="timer-display" style="margin-top: 5px; color: yellow;"></div>
        <div id="hint-display" style="font-weight: bold; margin-top: 5px; color: blue;"></div> 
    </div>
    
    <script src="script.js"></script>
</body>
</html>
