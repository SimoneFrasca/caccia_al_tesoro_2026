<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Bonaparte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Sconosciuto</span>
                <span class="message-text">
                    Formidabile, vediamo come ve la cavate con i numeri:
                </span>
            </div>
        </div>
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Sconosciuto</span>
                <span class="message-text">
                    <img src="calcolo_enigmistico.png" alt="Descrizione immagine" style="max-width: 250px; vertical-align: middle;">
                </span>
            </div>
        </div>
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Sconosciuto</span>
                <span class="message-text">
                    <img src="codice_enigmistico.png" alt="Descrizione immagine" style="max-width: 250px; vertical-align: middle;">
                    Ogni simbolo corrisponde ad <b>un solo numero</b> da 0 a 9 e simboli diversi non possono avere lo 
                    stesso numero (inserirli senza virgole  o altro, es: 01234567)
                </span>
            </div>
        </div>

        <div class="reply-area">
            <input type="text" id="chiave_livello" placeholder="Scrivi il codice...">
            <button onclick="checkAnswers('livello4')" class="send-btn">➤</button>
        </div>

        <div id="error" style="color: red; font-weight: bold; margin-top: 10px;"></div>
        <div id="timer-display" style="margin-top: 5px; color: yellow;"></div>
        <div id="hint-display" style="font-weight: bold; margin-top: 5px; color: blue;"></div> 
    </div>
    
    <script src="script.js"></script>
</body>
</html>
