<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Bonaparte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">

        <div class="message-bubble">
            <div class="icon-bubble">🎤</div> <!-- Icona microfono per l'audio -->
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <!-- Inserisci qui l'audio -->
                <audio controls class="custom-audio">
                    <source src="audio1.mp3" type="audio/mpeg">
                    Il tuo browser non supporta l'elemento audio.
                </audio>
            </div>
        </div>

        <div class="message-bubble">
            <div class="icon-bubble">🎤</div> <!-- Icona microfono per l'audio -->
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <!-- Inserisci qui l'audio -->
                <audio controls class="custom-audio">
                    <source src="audio2.mp3" type="audio/mpeg">
                    Il tuo browser non supporta l'elemento audio.
                </audio>
            </div>
        </div>

        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <span class="message-text">
                    Come si chiama un sistema in cui le persone lavorano insieme, 
                    si aiutano e decidono in modo condiviso, senza un capo unico?
                </span>
            </div>
        </div>

        <div class="reply-area">
            <input type="text" id="chiave_livello" placeholder="Scrivi il codice...">
            <button onclick="checkAnswers('livello5')" class="send-btn">➤</button>
        </div>

        <div id="error" style="color: red; font-weight: bold; margin-top: 10px;"></div>
        <div id="timer-display" style="margin-top: 5px; color: yellow;"></div>
        <div id="hint-display" style="font-weight: bold; margin-top: 5px; color: blue;"></div> 
    </div>
    
    <script src="script.js"></script>
</body>
</html>
