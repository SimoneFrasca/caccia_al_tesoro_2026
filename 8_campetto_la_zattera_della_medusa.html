<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Bonaparte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Sconosciuto</span>
                <span class="message-text">
                    ◉ 5<sup>5</sup> ÷ 5 − 12 <br>
                    ◉ (50 ÷ 2) − (7 × 3) + 90 x 11 + 26 <br>
                    ◉ (101 × 3) − (2 × 9) + 35 <br>
                    ◉ (18 ÷ 3) × 18− 5 <br>
                    ◉ (14 × 2) x 7 + 20 <br>
                    ◉ (64 ÷ 8) + (6 × 2) + (12x13) + (7x8) - 17 <br>
                    ◉ 9 × (3 + 2) - 47 + 107 <br>
                    ◉ (7 × 8) + (5 × 8) +5 <br>
                </span>
            </div>
        </div>

         <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Sconosciuto</span>
                <span class="message-text">
                    Non ci interessa tutto il risultato...
                </span>
            </div>
        </div>

        <div class="reply-area">
            <input type="text" id="chiave_livello" placeholder="Scrivi il codice...">
            <button onclick="checkAnswers('livello8')" class="send-btn">➤</button>
        </div>

        <div id="error" style="color: red; font-weight: bold; margin-top: 10px;"></div>
        <div id="timer-display" style="margin-top: 5px; color: yellow;"></div>
        <div id="hint-display" style="font-weight: bold; margin-top: 5px; color: blue;"></div> 
    </div>
    
    <script src="script.js"></script>
</body>
</html>
