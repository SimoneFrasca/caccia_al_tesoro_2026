<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operazione Bonaparte</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-wrapper">
        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <span class="message-text">
                    Bravissimi, ora siete esperti di ogni monumento, vediamo come ve la cavate
                    con le vie... Qui abita un mio caro amico ricettatore di gioielli, sarà il vostro
                    appoggio per questa operazione. Per sicurezza non vi dirò la via, riuscirete a individuarla voi?
                </span>
            </div>
        </div>

        <div class="message-bubble">
            <div class="icon-bubble">💬</div>
            <div class="bubble-content">
                <span class="sender">Il professore</span>
                <span class="message-text">
                    <img src="immagini_parigi/foto.jpeg" alt="" style="max-width: 100%; height: auto;">
                </span>
            </div>
        </div>

        <div class="reply-area">
            <input type="text" id="chiave_livello" placeholder="Scrivi il codice...">
            <button onclick="checkAnswers('livello13')" class="send-btn">➤</button>
        </div>

        <div id="error" style="color: red; font-weight: bold; margin-top: 10px;"></div>
        <div id="timer-display" style="margin-top: 5px; color: yellow;"></div>
        <div id="hint-display" style="font-weight: bold; margin-top: 5px; color: blue;"></div> 
    </div>
    
    <script src="script.js"></script>
</body>
</html>
